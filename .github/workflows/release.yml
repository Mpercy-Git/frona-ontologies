name: release

# Manual only. These sources are effectively frozen — KBpedia has not changed since
# Feb 2020 — so a schedule would be a no-op that runs forever. A release happens because
# a recipe changed and someone decided to publish it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check, but publish nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Toolchain comes from mise.toml, so CI and a developer's machine build with the
      # same rustc. `@stable` here would drift from the pinned version the moment one
      # released, and an output difference traced to a compiler is not a debugging
      # session anyone wants.
      - uses: jdx/mise-action@v3

      - uses: Swatinem/rust-cache@v2

      # The whole pre-release pipeline in one task: guards, lint, build, and then the
      # three checks that read what was actually produced — every count in metadata.json
      # re-derived from the published bytes, the extractor held to an OWL 2 RL reasoner in
      # both directions, and 1,000 sampled projections reasoned against the whole
      # catalogue. Those three used to run only when someone remembered to; a release is
      # exactly the moment they are worth waiting for, so nothing is published that has
      # not been through all of them.
      #
      # `--jobs 1` because `verify` names test, lint and build as independent dependencies
      # and mise runs tasks in parallel by default (4 of them), which would put three
      # cargo invocations on one target directory at once. Serialised, they run in the
      # order `verify` lists them — guards, lint, then build — so a broken decomposition
      # still fails before 40 MB is downloaded rather than after.
      - name: Build and verify
        run: mise run verify --jobs 1

      - name: Summary
        run: |
          {
            echo '### Artifacts'
            echo '```'
            find dist -type f | sort | while read -r f; do
              printf '%-44s %6s KB\n' "${f#dist/}" "$(( $(wc -c < "$f") / 1024 ))"
            done
            echo '```'
            echo '### Sources'
            jq -r '.sources[] | "- **\(.name)** \(.version) — \(.classes) classes, \(.properties) properties, \(.disjoint_pairs) disjoint (\(.license))"' dist/metadata.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ont-$(date -u +%Y%m%dT%H%M%SZ)"
          gh release create "$TAG" dist/*.ttl.gz dist/metadata.json dist/NOTICE \
            --title "$TAG" \
            --notes "Distilled ontology artifacts. See metadata.json for per-source counts, licences and checksums; NOTICE for required attribution.

          Consume a pinned tag rather than \`latest\` — reasoning output should not change because a release was cut."
